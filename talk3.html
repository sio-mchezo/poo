<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UK Poo</title>
    <style>
        body { margin: 0; overflow: hidden; 
            background: #000; }
        canvas { display: block; }
        #hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        #hud button {
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background: #f0e68c;
            color: #2d2d2d;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        #hud button:hover:not(:disabled) {
            transform: scale(1.05);
            background: #ffd700;
        }
        #hud button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #subtitles {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: monospace;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
            min-width: 200px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            padding: 10px 20px;
        }
        #subtitles .highlight {
            padding: 4px 12px;
            font-weight: bold;
            animation: pop 0.2s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="hud">
        <button id="speakBtn">speak</button>
    </div>
    <div id="subtitles">&nbsp;</div>

    <script src="js/rant.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.140.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.140.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        var rant = require("rant");
        const rants = [
            "Your breath come smell like quavers",
            "Your breath come smell like wotsits",
        ];

        function generateRant() {
            return rant(rants[Math.floor(Math.random() * rants.length)]);
        }

        // Joystick variables
        let joystick = null;
        let joystickActive = false;
        let joystickForce = 0;
        let joystickVelocityX = 0;

        function setupJoystick() {
            if (typeof nipplejs !== 'undefined') {
                joystick = nipplejs.create({
                    zone: document.body,
                    dataOnly: true
                });

                joystick.on('move', (evt, data) => {
                    if (data.force && data.force > 0.1) {
                        joystickActive = true;
                        joystickForce = data.force;
                        joystickVelocityX = data.vector.x * JOYSTICK_MAX_SPEED;
                    }
                });

                joystick.on('end', () => {
                    joystickActive = false;
                    joystickForce = 0;
                    joystickVelocityX = 0;
                });
            }
        }

        const JOYSTICK_MAX_SPEED = 3;
        setupJoystick();

        // Camera rotation variables
        let targetCameraRotationX = 0;
        let targetCameraRotationY = 0;
        let currentCameraRotationX = 0;
        let currentCameraRotationY = 0;
        const CAMERA_SMOOTHING = 0.08; // Lower = smoother but slower
        const CAMERA_MAX_ROTATION = 0.4; // Maximum rotation in radians

        function handlePointerMove(clientX, clientY) {
            // Convert to normalized coordinates (-1 to 1)
            const normalizedX = (clientX / window.innerWidth) * 2 - 1;
            const normalizedY = -(clientY / window.innerHeight) * 2 + 1;
            
            // Map to camera rotation with limits
            targetCameraRotationY = -normalizedX * CAMERA_MAX_ROTATION;
            targetCameraRotationX = normalizedY * CAMERA_MAX_ROTATION * 0.6;
        }
        
        document.addEventListener('mousemove', (event) => {
            handlePointerMove(event.clientX, event.clientY);
        });
        
        document.addEventListener('touchmove', (event) => {
            if (event.touches.length > 0) {
                handlePointerMove(event.touches[0].clientX, event.touches[0].clientY);
            }
        }, { passive: true });

        // scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ 
            alpha: true,
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.sortObjects = true;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // rig
        const cameraRig = new THREE.Group();
        cameraRig.add(camera);
        scene.add(cameraRig);
        camera.position.set(0, 1, 6); 
        camera.lookAt(0,0,0)

        // lights
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 3);
        scene.add(dirLight);

        // textures
        const textureLoader = new THREE.TextureLoader();
        const bgTex = textureLoader.load('images/poo.png');
        const eyeTex = textureLoader.load('images/eye.png');
        const mouthTex = textureLoader.load('images/mouths4.png');
        const browsTex = textureLoader.load('images/brows.png');
        const poobumpTex = textureLoader.load('images/poobmp.png');
        const ptex = textureLoader.load('images/flag2.jpg');
        ptex.magFilter = THREE.NearestFilter;
        ptex.minFilter = THREE.NearestFilter;

        [bgTex, mouthTex, browsTex, ptex].forEach(tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
        });

        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = 512;
        faceCanvas.height = 512;
        const ctx = faceCanvas.getContext('2d');

        const FACE_OFFSETS = {
            brows: { x: 128, y: 128, w: 256, h: 256 },
            eyeL: { x: 138, y: 256, w: 128, h: 128 },
            eyeR: { x: 246, y: 256, w: 128, h: 128 },
            mouth: { x: 224, y: 288, w: 64, h: 64 }
        };

        const BODY_Y_OFFSET = 50;
        const EYE_SPRITE_WIDTH = 128;
        const MOUTH_SPRITE_WIDTH = 128;

        const phonemeMap = {
            " ": 0, ".": 0, ",": 0, "?": 0, "!": 0,
            a: 1, A: 1, g: 1, G: 1, k: 1, K: 1, t: 1, T: 1,
            i: 2, I: 2, y: 2, e: 2, E: 2, s: 2, S: 2,
            z: 2, Z: 2, n: 2, N: 2, d: 2, D: 2,
            l: 2, L: 2, h: 2, H: 2, c: 2, C: 2,
            o: 3, O: 3, u: 3, U: 3, w: 3, q: 3,
            m: 3, M: 3, p: 3, f: 3, F: 3, v: 3, V: 3,
            r: 3, R: 3, b: 1, B: 1
        };

        function drawFace(mouthIdx = 0, eyeIdx = 0, browsY = 0) {
            ctx.clearRect(0, 0, 512, 512);
            if (browsTex.image) {
                const bx = FACE_OFFSETS.brows.x;
                const by = FACE_OFFSETS.brows.y + BODY_Y_OFFSET + browsY;
                ctx.drawImage(browsTex.image, bx, by, FACE_OFFSETS.brows.w, FACE_OFFSETS.brows.h);
            }
            if (eyeTex.image) {
                const sxL = eyeIdx * EYE_SPRITE_WIDTH;
                ctx.drawImage(eyeTex.image, sxL, 0, EYE_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.eyeL.x, FACE_OFFSETS.eyeL.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.eyeL.w, FACE_OFFSETS.eyeL.h);
                ctx.drawImage(eyeTex.image, sxL, 0, EYE_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.eyeR.x, FACE_OFFSETS.eyeR.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.eyeR.w, FACE_OFFSETS.eyeR.h);
            }
            if (mouthTex.image) {
                const sxM = mouthIdx * MOUTH_SPRITE_WIDTH;
                ctx.drawImage(mouthTex.image, sxM, 0, MOUTH_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.mouth.x, FACE_OFFSETS.mouth.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.mouth.w, FACE_OFFSETS.mouth.h);
            }
        }
        drawFace(0, 0, 0);
        const faceTexture = new THREE.CanvasTexture(faceCanvas);
        faceTexture.minFilter = THREE.LinearFilter;
        faceTexture.magFilter = THREE.LinearFilter;

        const faceGroup = new THREE.Group();
        faceGroup.position.set(0, 0, 0);
        scene.add(faceGroup);

        const pivotGroup = new THREE.Group();
        faceGroup.add(pivotGroup);

        window.doSquashBounce = () => {
            new TWEEN.Tween(faceGroup.scale)
                .to({ x: 1.05, y: 0.95, z: 1.05 }, 200)
                .easing(TWEEN.Easing.Quadratic.In)
                .start();

            setTimeout(() => {
                new TWEEN.Tween(faceGroup.position).to({ y: 0.05 }, 100).start();
                new TWEEN.Tween(faceGroup.scale).to({ x: 0.95, y: 1.05, z: 1 }, 100).start();

                setTimeout(() => {
                    new TWEEN.Tween(faceGroup.position).to({ y: 0 }, 100).start();
                    new TWEEN.Tween(faceGroup.scale).to({ x: 1, y: 1, z: 1 }, 200).start();
                }, 100);
            }, 200);
        };

        const paveMat = new THREE.MeshLambertMaterial({
            color: 0x8e897c,
            map: ptex,
        });
        const pave = new THREE.Mesh(new THREE.CircleGeometry(6, 40), paveMat);
        pave.rotation.set(-Math.PI / 2, 0, 0);
        pave.receiveShadow = true;
        scene.add(pave);

        let mouthFrame = 0, eyeFrame = 0, browsOffset = 0, time = 0;
        let faceBone = null;
        let isSpeaking = false;
        let lipSyncTimeouts = [];
        let boneSprings = [];

        const subtitlesEl = document.getElementById('subtitles');
        const speakBtn = document.getElementById('speakBtn');

        function renderFace() {
            drawFace(mouthFrame, eyeFrame, browsOffset);
            faceTexture.needsUpdate = true;
        }

        function updateSubtitles(word) {
            subtitlesEl.innerHTML = word ? `<span class="highlight">${word}</span>` : '&nbsp;';
        }

        function lipSyncWord(word, startDelay = 0) {
            let charDelay = 0;
            const CHAR_SPEED = 50;

            word.split('').forEach(char => {
                const timeout = setTimeout(() => {
                    mouthFrame = phonemeMap[char.toLowerCase()] || 0;
                    renderFace();
                }, startDelay + charDelay);
                lipSyncTimeouts.push(timeout);
                charDelay += CHAR_SPEED;
            });

            const resetTimeout = setTimeout(() => {
                mouthFrame = 0;
                renderFace();
            }, startDelay + charDelay + 100);
            lipSyncTimeouts.push(resetTimeout);
        }

        function clearTimeouts() {
            lipSyncTimeouts.forEach(clearTimeout);
            lipSyncTimeouts = [];
        }

        function getUKVoice() {
            const voices = speechSynthesis.getVoices();
            const preferredVoices = [
                'Google UK English Male',
                'Daniel',
                'Microsoft Ryan Online (Natural) - English (United Kingdom)',
            ];
            
            for (const preferredName of preferredVoices) {
                const voice = voices.find(v => v.name === preferredName);
                if (voice) return voice;
            }
            
            const ukVoice = voices.find(v => 
                v.lang === 'en-GB' || 
                v.lang === 'en_GB' || 
                v.lang.toLowerCase().includes('en-gb') || 
                v.lang.toLowerCase().includes('en_gb')
            );
            if (ukVoice) return ukVoice;
            
            return voices.find(v => v.lang.toLowerCase().includes('en')) || voices[0];
        }

        function handleSpeak() {
            if (isSpeaking) return;
            
            window.doSquashBounce();
            speechSynthesis.cancel();
            
            const rant = generateRant();
            const words = rant.split(/\s+/);
            
            updateSubtitles('');
            mouthFrame = 0;
            renderFace();
            clearTimeouts();

            const utterance = new SpeechSynthesisUtterance(rant);
            const voice = getUKVoice();
            if (voice) utterance.voice = voice;
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            
            isSpeaking = true;
            speakBtn.disabled = true;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const wordCount = rant.substring(0, event.charIndex).split(/\s+/).length - 1;
                    if (wordCount >= 0 && wordCount < words.length) {
                        updateSubtitles(words[wordCount]);
                        lipSyncWord(words[wordCount]);
                    }
                }
            };

            utterance.onend = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            utterance.onerror = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            speechSynthesis.speak(utterance);
        }

        speakBtn.removeEventListener('click', handleSpeak);
        speakBtn.addEventListener('click', handleSpeak);

        function loadModel() {
            const loader = new GLTFLoader();
            loader.load('assets/bones.glb', (gltf) => {
                const fbx = gltf.scene;
                const lightsToRemove = [];
                fbx.traverse((child) => {
                    if (child.isLight) lightsToRemove.push(child);
                });
                lightsToRemove.forEach(light => fbx.remove(light));
                if (fbx.environment) fbx.environment = null;

                const box = new THREE.Box3().setFromObject(fbx);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                fbx.position.sub(center);
                fbx.position.y = (-size.y / 2)+0.9;
                let targetBone = null;

                fbx.traverse(child => {
                    if (child.isMesh) {
                        const material = new THREE.MeshLambertMaterial({
                            map: bgTex,
                            side: THREE.FrontSide,
                        });
                        material.map.magFilter = THREE.NearestFilter;
                        material.map.minFilter = THREE.NearestFilter;

                        child.material = material;
                        child.castShadow = true;
                        child.receiveShadow = true;
                        child.renderOrder = 0;
                    }
                    if (child.isBone && child.name === 'Bone001') {
                        targetBone = child;
                    }
                });

                faceGroup.add(fbx);

                const planeMat = new THREE.MeshStandardMaterial({
                    map: faceTexture,
                    transparent: true,
                    alphaTest: 0.01,
                    displacementMap: poobumpTex,
                    displacementScale: 3,
                    side: THREE.FrontSide,
                    depthTest: false,
                    depthWrite: false,
                });
                planeMat.map.magFilter = THREE.NearestFilter;
                planeMat.map.minFilter = THREE.NearestFilter;
                
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3, 32, 1), planeMat);
                plane.position.set(0, 0.4, 0);
                plane.rotation.set(-0.35, 0, 0);
                plane.renderOrder = 1;
                plane.frustumCulled = false;
                pivotGroup.add(plane)

                if (targetBone) {
                    targetBone.add(pivotGroup);
                    faceBone = targetBone;
                } else {
                    fbx.add(pivotGroup);
                }

                const bonePositions = [];
                
                fbx.traverse((child) => {
                    if (child.isBone) {
                        const worldPos = new THREE.Vector3();
                        child.getWorldPosition(worldPos);
                        bonePositions.push({
                            bone: child,
                            worldY: worldPos.y
                        });
                    }
                });
                
                let minY = Infinity;
                let maxY = -Infinity;
                bonePositions.forEach(bp => {
                    if (bp.worldY < minY) minY = bp.worldY;
                    if (bp.worldY > maxY) maxY = bp.worldY;
                });
                const yRange = maxY - minY || 1;
                
                boneSprings = bonePositions.map(bp => {
                    const normalizedHeight = (bp.worldY - minY) / yRange;
                    const heightFactor = Math.pow(normalizedHeight, 0.7);
                    
                    return {
                        bone: bp.bone,
                        heightFactor: heightFactor,
                        originalRotation: new THREE.Euler().copy(bp.bone.rotation),
                        velocityZ: 0,
                        velocityX: 0,
                        positionZ: 0,
                        positionX: 0
                    };
                });
            });
        }

        loadModel();

        // Movement variables
        let velocity = 0;
        let targetVelocity = 0;
        const MAX_SPEED = 3;
        const ACCELERATION = 15;
        const FRICTION = 14;
        
        const SPRING_STIFFNESS = 80;
        const SPRING_DAMPING = 8;
        const MAX_BONE_ROTATION = 0.1;

        function updateMovement(delta) {
            if (joystickActive) {
                targetVelocity = joystickVelocityX;
            } else {
                if (keys['arrowleft'] || keys['a']) {
                    targetVelocity = -MAX_SPEED;
                } else if (keys['arrowright'] || keys['d']) {
                    targetVelocity = MAX_SPEED;
                } else {
                    targetVelocity = 0;
                }
            }
            
            if (targetVelocity !== 0) {
                velocity += (targetVelocity - velocity) * Math.min(1, ACCELERATION * delta);
            } else {
                velocity += (0 - velocity) * Math.min(1, FRICTION * delta);
            }
            
            faceGroup.position.x += velocity * delta;
            faceGroup.position.x = Math.max(-5, Math.min(5, faceGroup.position.x));
            
            // rig
            cameraRig.position.x = faceGroup.position.x;
            
            // rig rotation
            cameraRig.rotation.x = currentCameraRotationX;
            cameraRig.rotation.y = currentCameraRotationY;


            if (boneSprings.length > 0) {
                boneSprings.forEach((spring) => {
                    const heightFactor = spring.heightFactor;
                    
                    const targetZ = velocity * 0.15 * heightFactor;
                    const targetX = Math.abs(velocity) * 0.08 * heightFactor;
                    
                    const forceZ = (targetZ - spring.positionZ) * SPRING_STIFFNESS;
                    const forceX = (targetX - spring.positionX) * SPRING_STIFFNESS;
                    
                    const dampingZ = spring.velocityZ * SPRING_DAMPING;
                    const dampingX = spring.velocityX * SPRING_DAMPING;
                    
                    const accelerationZ = forceZ - dampingZ;
                    const accelerationX = forceX - dampingX;
                    
                    spring.velocityZ += accelerationZ * delta;
                    spring.velocityX += accelerationX * delta;
                    
                    spring.positionZ += spring.velocityZ * delta;
                    spring.positionX += spring.velocityX * delta;
                    
                    spring.positionZ = Math.max(-MAX_BONE_ROTATION, Math.min(MAX_BONE_ROTATION, spring.positionZ));
                    spring.positionX = Math.max(-MAX_BONE_ROTATION * 0.5, Math.min(MAX_BONE_ROTATION * 0.5, spring.positionX));
                    
                    spring.bone.rotation.z = spring.originalRotation.z + spring.positionZ;
                    spring.bone.rotation.x = spring.originalRotation.x + spring.positionX;
                });
            }
            

            // Face rotation based on movement direction
            if (pivotGroup) {
                // Target rotation based on velocity direction
                const MAX_FACE_ROTATION = -Math.PI / 6; // 30 degrees in radians
                let targetPivotRotation = 0;
                
                if (Math.abs(velocity) > 0.1) {
                    // Normalize velocity to -1 to 1 range and map to rotation
                    const normalizedVelocity = Math.max(-1, Math.min(1, velocity / MAX_SPEED));
                    targetPivotRotation = -normalizedVelocity * MAX_FACE_ROTATION;
                }
                
                // Smoothly interpolate rotation
                const rotationSmoothing = 8 * delta; // Adjust for faster/slower response
                pivotGroup.rotation.y += (targetPivotRotation - pivotGroup.rotation.y) * Math.min(1, rotationSmoothing);
                
                // Snap back to center when stopped
                if (Math.abs(velocity) < 0.05) {
                    pivotGroup.rotation.y *= (1 - Math.min(1, 10 * delta));
                }
            }

            // if (Math.abs(velocity) < 0.05) {
            //     faceGroup.rotation.z *= (1 - Math.min(1, 8 * delta));
            // }
        }

        // Keyboard
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        let clock = new THREE.Clock();
        let elapsedTime = 0;

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.033);
            elapsedTime += delta;
            time += 0.02;

            if (!isSpeaking) {
                browsOffset = Math.sin(time * 1.2) * 3;
                renderFace();
            }

            eyeFrame = Math.sin(time * 3) > 0.9 ? 1 : 0;

            // Smooth camera rotation
            currentCameraRotationX += (targetCameraRotationX - currentCameraRotationX) * CAMERA_SMOOTHING;
            currentCameraRotationY += (targetCameraRotationY - currentCameraRotationY) * CAMERA_SMOOTHING;
            
            // Apply rotation to scene (or camera group)
            scene.rotation.x = currentCameraRotationX;
            scene.rotation.y = currentCameraRotationY;
            
            // camera 
            camera.position.y = Math.max(1.5, camera.position.y);

            updateMovement(delta);
            TWEEN.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = () => {
            speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
