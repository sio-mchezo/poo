<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UK Poo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #hud { position: absolute; bottom: 30px; left: 30px; }
        #hud button {
            padding: 10px 20px; font-size: 22px; border: none;
            background: rgba(0, 0, 0, 0.3); color: #fff; cursor: pointer;
            font-family: monospace; transition: all 0.2s;
        }
        #hud button:hover:not(:disabled) { color: #fff000; background: rgba(0, 0, 0, 0.5); }
        #hud button:disabled { opacity: 0.5; cursor: not-allowed; }
        #subtitles {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-family: monospace; font-size: 24px; text-align: center;
            pointer-events: none; min-width: 200px; min-height: 50px;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); padding: 10px 20px;
        }
        #subtitles .highlight { padding: 4px 12px; font-weight: bold; animation: pop 0.2s ease; }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="hud"><button id="speakBtn">speak</button></div>
    <div id="subtitles">&nbsp;</div>

    <script src="js/rant.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.140.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.140.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        var rant = require("rant");
        const rants = ["Your breath come smell like quavers", "Your breath come smell like wotsits"];
        function generateRant() { return rant(rants[Math.floor(Math.random() * rants.length)]); }

        let joystick = null, joystickActive = false, joystickVelocityX = 0, joystickVelocityY = 0;
        function setupJoystick() {
            if (typeof nipplejs === 'undefined') return;
            joystick = nipplejs.create({ zone: document.body, dataOnly: true });
            joystick.on('move', (evt, data) => {
                if (data.force > 0.1) {
                    joystickActive = true;
                    joystickVelocityX = data.vector.x * 2;
                    joystickVelocityY = data.vector.y * 2;
                }
            });
            joystick.on('end', () => {
                joystickActive = false;
                joystickVelocityX = 0;
                joystickVelocityY = 0;
            });
        }
        setupJoystick();

        let targetCamRotX = 0, targetCamRotY = 0, currentCamRotX = 0, currentCamRotY = 0;
        function handlePointerMove(clientX, clientY) {
            targetCamRotY = -((clientX / window.innerWidth) * 2 - 1) * 0.4;
            targetCamRotX = (-(clientY / window.innerHeight) * 2 + 1) * 0.24;
        }
        document.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
        document.addEventListener('touchmove', e => { if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.sortObjects = true;
        document.body.appendChild(renderer.domElement);

        const cameraRig = new THREE.Group();
        cameraRig.add(camera);
        scene.add(cameraRig);
        camera.position.set(0, 1, 6);
        camera.lookAt(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
        dirLight.position.set(3, 7, 1);
        scene.add(dirLight);

        const textureLoader = new THREE.TextureLoader();
        const bgTex = textureLoader.load('images/poo.png');
        const eyeTex = textureLoader.load('images/eye.png');
        const mouthTex = textureLoader.load('images/mouths4.png');
        const browsTex = textureLoader.load('images/brows.png');
        const poobumpTex = textureLoader.load('images/poobmp.png');
        const ptex = textureLoader.load('images/flag2.jpg');
        [bgTex, mouthTex, browsTex, ptex].forEach(tex => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
        });

        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = faceCanvas.height = 512;
        const ctx = faceCanvas.getContext('2d');
        const FACE_OFFSETS = {
            brows: { x: 128, y: 128, w: 256, h: 256 },
            eyeL: { x: 138, y: 256, w: 128, h: 128 },
            eyeR: { x: 246, y: 256, w: 128, h: 128 },
            mouth: { x: 224, y: 288, w: 64, h: 64 }
        };
        const phonemeMap = {
            " ":0,".":0,",":0,"?":0,"!":0,a:1,A:1,g:1,G:1,k:1,K:1,t:1,T:1,
            i:2,I:2,y:2,e:2,E:2,s:2,S:2,z:2,Z:2,n:2,N:2,d:2,D:2,l:2,L:2,h:2,H:2,c:2,C:2,
            o:3,O:3,u:3,U:3,w:3,q:3,m:3,M:3,p:3,f:3,F:3,v:3,V:3,r:3,R:3,b:1,B:1
        };

        function drawFace(mouthIdx = 0, eyeIdx = 0, browsY = 0) {
            ctx.clearRect(0, 0, 512, 512);
            if (browsTex.image) ctx.drawImage(browsTex.image, FACE_OFFSETS.brows.x, FACE_OFFSETS.brows.y + 50 + browsY, 256, 256);
            if (eyeTex.image) {
                const sx = eyeIdx * 128;
                ctx.drawImage(eyeTex.image, sx, 0, 128, 128, 138, 306, 128, 128);
                ctx.drawImage(eyeTex.image, sx, 0, 128, 128, 246, 306, 128, 128);
            }
            if (mouthTex.image) ctx.drawImage(mouthTex.image, mouthIdx * 128, 0, 128, 128, 224, 338, 64, 64);
        }
        drawFace();
        const faceTexture = new THREE.CanvasTexture(faceCanvas);
        faceTexture.minFilter = THREE.LinearFilter;
        faceTexture.magFilter = THREE.LinearFilter;

        const faceGroup = new THREE.Group();
        scene.add(faceGroup);
        const pivotGroup = new THREE.Group();
        faceGroup.add(pivotGroup);

        window.doSquashBounce = () => {
            new TWEEN.Tween(faceGroup.scale).to({ x: 1.05, y: 0.95, z: 1.05 }, 200).easing(TWEEN.Easing.Quadratic.In).start();
            setTimeout(() => {
                new TWEEN.Tween(faceGroup.position).to({ y: 0.05 }, 100).start();
                new TWEEN.Tween(faceGroup.scale).to({ x: 0.95, y: 1.05, z: 1 }, 100).start();
                setTimeout(() => {
                    new TWEEN.Tween(faceGroup.position).to({ y: 0 }, 100).start();
                    new TWEEN.Tween(faceGroup.scale).to({ x: 1, y: 1, z: 1 }, 200).start();
                }, 100);
            }, 200);
        };

        const pave = new THREE.Mesh(
            new THREE.CircleGeometry(6, 40),
            new THREE.MeshLambertMaterial({ color: 0x8e897c, map: ptex })
        );
        pave.rotation.x = -Math.PI / 2;
        scene.add(pave);

        const shadowTex = textureLoader.load('images/shdw.png');
        const shadowPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, alphaTest:0.1 })
        );
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = 0.01;
        faceGroup.add(shadowPlane);

        let mouthFrame = 0, eyeFrame = 0, browsOffset = 0, time = 0, isSpeaking = false, lipSyncTimeouts = [], boneSprings = [];
        const subtitlesEl = document.getElementById('subtitles');
        const speakBtn = document.getElementById('speakBtn');

        function renderFace() { drawFace(mouthFrame, eyeFrame, browsOffset); faceTexture.needsUpdate = true; }
        function updateSubtitles(word) { subtitlesEl.innerHTML = word ? `<span class="highlight">${word}</span>` : '&nbsp;'; }

        function lipSyncWord(word, startDelay = 0) {
            let charDelay = 0;
            word.split('').forEach(char => {
                lipSyncTimeouts.push(setTimeout(() => { mouthFrame = phonemeMap[char.toLowerCase()] || 0; renderFace(); }, startDelay + charDelay));
                charDelay += 50;
            });
            lipSyncTimeouts.push(setTimeout(() => { mouthFrame = 0; renderFace(); }, startDelay + charDelay + 100));
        }
        function clearTimeouts() { lipSyncTimeouts.forEach(clearTimeout); lipSyncTimeouts = []; }

        function getUKVoice() {
            const voices = speechSynthesis.getVoices();
            for (const name of ['Google UK English Male', 'Daniel', 'Microsoft Ryan Online (Natural) - English (United Kingdom)']) {
                const v = voices.find(v => v.name === name);
                if (v) return v;
            }
            return voices.find(v => v.lang?.toLowerCase().includes('en-gb')) || voices.find(v => v.lang?.toLowerCase().includes('en')) || voices[0];
        }

        speakBtn.addEventListener('click', () => {
            if (isSpeaking) return;
            window.doSquashBounce();
            speechSynthesis.cancel();
            const rant = generateRant();
            const words = rant.split(/\s+/);
            updateSubtitles(''); mouthFrame = 0; renderFace(); clearTimeouts();
            const utterance = new SpeechSynthesisUtterance(rant);
            const voice = getUKVoice();
            if (voice) utterance.voice = voice;
            utterance.rate = 0.85; utterance.pitch = 1.1;
            isSpeaking = true; speakBtn.disabled = true;
            utterance.onboundary = e => {
                if (e.name === 'word') {
                    const idx = rant.substring(0, e.charIndex).split(/\s+/).length - 1;
                    if (idx >= 0 && idx < words.length) { updateSubtitles(words[idx]); lipSyncWord(words[idx]); }
                }
            };
            utterance.onend = utterance.onerror = () => {
                updateSubtitles(''); mouthFrame = 0; renderFace();
                isSpeaking = false; speakBtn.disabled = false; clearTimeouts();
            };
            speechSynthesis.speak(utterance);
        });

        function loadModel() {
            new GLTFLoader().load('assets/bones.glb', gltf => {
                const model = gltf.scene;
                model.traverse(child => {
                    if (child.isLight) model.remove(child);
                    if (child.isMesh) {
                        child.material = new THREE.MeshLambertMaterial({ map: bgTex, side: THREE.FrontSide });
                        child.material.map.magFilter = THREE.NearestFilter;
                        child.material.map.minFilter = THREE.NearestFilter;
                        child.castShadow = true;
                    }
                });
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                model.position.sub(center);
                model.position.y = -size.y / 2 + 0.9;
                let targetBone = null;
                model.traverse(child => { if (child.isBone && child.name === 'Bone001') targetBone = child; });
                faceGroup.add(model);

                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(3, 3, 32, 1),
                    new THREE.MeshStandardMaterial({
                        map: faceTexture, transparent: true, alphaTest: 0.01,
                        displacementMap: poobumpTex, displacementScale: 3,
                        side: THREE.FrontSide, depthTest: false, depthWrite: false
                    })
                );
                plane.material.map.magFilter = THREE.NearestFilter;
                plane.material.map.minFilter = THREE.NearestFilter;
                plane.position.set(0, 0.4, 0);
                plane.rotation.x = -0.35;
                plane.renderOrder = 1;
                plane.frustumCulled = false;

                pivotGroup.add(plane);
                if (targetBone) targetBone.add(pivotGroup); else model.add(pivotGroup);

                const bonePositions = [];
                model.traverse(child => {
                    if (child.isBone) {
                        const worldPos = new THREE.Vector3();
                        child.getWorldPosition(worldPos);
                        bonePositions.push({ bone: child, worldY: worldPos.y });
                    }
                });
                let minY = Infinity, maxY = -Infinity;
                bonePositions.forEach(bp => { if (bp.worldY < minY) minY = bp.worldY; if (bp.worldY > maxY) maxY = bp.worldY; });
                const yRange = maxY - minY || 1;
                boneSprings = bonePositions.map(bp => ({
                    bone: bp.bone,
                    heightFactor: Math.pow((bp.worldY - minY) / yRange, 0.7),
                    originalRotation: new THREE.Euler().copy(bp.bone.rotation),
                    velocityZ: 0, velocityX: 0, positionZ: 0, positionX: 0
                }));
            });
        }
        loadModel();

        const keys = {};
        addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault(); });
        addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        let velocity = 0, targetVelocity = 0;


        function updateMovement(delta) {
            if (joystickActive) targetVelocity = joystickVelocityX;
            else if (keys['arrowleft'] || keys['a']) targetVelocity = -1;
            else if (keys['arrowright'] || keys['d']) targetVelocity = 1;
            else targetVelocity = 0;

            velocity += (targetVelocity - velocity) * Math.min(1, (targetVelocity ? 10 : 25) * delta);
            faceGroup.position.x = Math.max(-5, Math.min(5, faceGroup.position.x + velocity * delta));
            cameraRig.position.x = faceGroup.position.x;
            cameraRig.rotation.x = currentCamRotX;
            cameraRig.rotation.y = currentCamRotY;

            boneSprings.forEach(spring => {
                const targetZ = velocity * 0.15 * spring.heightFactor;
                const targetX = Math.abs(velocity) * 0.08 * spring.heightFactor;
                const forceZ = (targetZ - spring.positionZ) * 80;
                const forceX = (targetX - spring.positionX) * 80;
                spring.velocityZ += (forceZ - spring.velocityZ * 8) * delta;
                spring.velocityX += (forceX - spring.velocityX * 8) * delta;
                spring.positionZ = Math.max(-0.1, Math.min(0.1, spring.positionZ + spring.velocityZ * delta));
                spring.positionX = Math.max(-0.05, Math.min(0.05, spring.positionX + spring.velocityX * delta));
                spring.bone.rotation.z = spring.originalRotation.z + spring.positionZ;
                spring.bone.rotation.x = spring.originalRotation.x + spring.positionX;
            });

            if (pivotGroup) {
                const targetRotY = Math.abs(velocity) > 0.3 ? -Math.sign(velocity) * Math.PI / 6 : 0;
                pivotGroup.rotation.y += (-targetRotY - pivotGroup.rotation.y) * Math.min(1, 8 * delta);
                pivotGroup.rotation.x += ((-joystickVelocityY * 0.05) - pivotGroup.rotation.x) * Math.min(1, 8 * delta);
                if (Math.abs(velocity) < 0.05) pivotGroup.rotation.y *= (1 - Math.min(1, 10 * delta));
            }
        }

        let clock = new THREE.Clock();
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.033);
            time += 0.02;

            if (!isSpeaking) {
                browsOffset = Math.sin(time * 1.2) * 3;
                renderFace();
            }
            eyeFrame = Math.sin(time * 3) > 0.9 ? 1 : 0;

            currentCamRotX += (targetCamRotX - currentCamRotX) * 0.08;
            currentCamRotY += (targetCamRotY - currentCamRotY) * 0.08;
            scene.rotation.x = currentCamRotX;
            scene.rotation.y = currentCamRotY;

            // camera stop
            camera.position.y = Math.max(1.8, camera.position.y);

            updateMovement(delta);
            TWEEN.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    </script>
</body>
</html>
