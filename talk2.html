<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UK Poo</title>
    <style>
        body { margin: 0; overflow: hidden; 
            background: #036C47; }
        canvas { display: block; }
        #hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        #hud button {
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background: #f0e68c;
            color: #2d2d2d;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        #hud button:hover:not(:disabled) {
            transform: scale(1.05);
            background: #ffd700;
        }
        #hud button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #subtitles {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: monospace;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
            min-width: 200px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            padding: 10px 20px;
        }
        #subtitles .highlight {
            padding: 4px 12px;
            font-weight: bold;
            animation: pop 0.2s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="hud">
        <button onclick="window.doSquashBounce()">bounce</button>
        <button id="speakBtn">speak</button>
    </div>
    <div id="subtitles">&nbsp;</div>

    <script src="js/rant.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        var rant = require("rant");
        const rants = [
            "Your breath come smell like quavers",
            "Your breath come smell like wotsits",
        ];

        function generateRant() {
            return rant(rants[Math.floor(Math.random() * rants.length)]);
        }

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 5);

        const renderer = new THREE.WebGLRenderer({ 
            alpha: true,
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.sortObjects = true;
        renderer.shadowMap.enabled = true;
        // renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.update();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 2);
        mainLight.position.set(3, 5, 4);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        fillLight.position.set(-3, 1, -2);
        scene.add(fillLight);

        const textureLoader = new THREE.TextureLoader();
        const bgTex = textureLoader.load('images/poo.png');
        bgTex.magFilter = THREE.NearestFilter;
        bgTex.minFilter = THREE.NearestFilter;

        const eyeTex = textureLoader.load('images/eye.png');
        const mouthTex = textureLoader.load('images/mouths4.png');
        const browsTex = textureLoader.load('images/brows.png');
        const poobumpTex = textureLoader.load('images/poobmp.png');
        const ptex = textureLoader.load('images/flag2.jpg');
        const shdwtex = textureLoader.load('images/shdw.png');
        ptex.magFilter = THREE.NearestFilter;
        ptex.minFilter = THREE.NearestFilter;

        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = 512;
        faceCanvas.height = 512;
        const ctx = faceCanvas.getContext('2d');

        const FACE_OFFSETS = {
            brows: { x: 128, y: 128, w: 256, h: 256 },
            eyeL: { x: 138, y: 256, w: 128, h: 128 },
            eyeR: { x: 246, y: 256, w: 128, h: 128 },
            mouth: { x: 224, y: 288, w: 64, h: 64 }
        };

        const BODY_Y_OFFSET = 50;
        const EYE_SPRITE_WIDTH = 128;
        const MOUTH_SPRITE_WIDTH = 128;

        const phonemeMap = {
            " ": 0, ".": 0, ",": 0, "?": 0, "!": 0,
            a: 1, A: 1, g: 1, G: 1, k: 1, K: 1, t: 1, T: 1,
            i: 2, I: 2, y: 2, e: 2, E: 2, s: 2, S: 2,
            z: 2, Z: 2, n: 2, N: 2, d: 2, D: 2,
            l: 2, L: 2, h: 2, H: 2, c: 2, C: 2,
            o: 3, O: 3, u: 3, U: 3, w: 3, q: 3,
            m: 3, M: 3, p: 3, f: 3, F: 3, v: 3, V: 3,
            r: 3, R: 3, b: 1, B: 1
        };

        function drawFace(mouthIdx = 0, eyeIdx = 0, browsY = 0) {
            ctx.clearRect(0, 0, 512, 512);
            if (browsTex.image) {
                const bx = FACE_OFFSETS.brows.x;
                const by = FACE_OFFSETS.brows.y + BODY_Y_OFFSET + browsY;
                ctx.drawImage(browsTex.image, bx, by, FACE_OFFSETS.brows.w, FACE_OFFSETS.brows.h);
            }
            if (eyeTex.image) {
                const sxL = eyeIdx * EYE_SPRITE_WIDTH;
                ctx.drawImage(eyeTex.image, sxL, 0, EYE_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.eyeL.x, FACE_OFFSETS.eyeL.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.eyeL.w, FACE_OFFSETS.eyeL.h);
                ctx.drawImage(eyeTex.image, sxL, 0, EYE_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.eyeR.x, FACE_OFFSETS.eyeR.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.eyeR.w, FACE_OFFSETS.eyeR.h);
            }
            if (mouthTex.image) {
                const sxM = mouthIdx * MOUTH_SPRITE_WIDTH;
                ctx.drawImage(mouthTex.image, sxM, 0, MOUTH_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.mouth.x, FACE_OFFSETS.mouth.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.mouth.w, FACE_OFFSETS.mouth.h);
            }
        }
        drawFace(0, 0, 0);
        const faceTexture = new THREE.CanvasTexture(faceCanvas);
        faceTexture.minFilter = THREE.LinearFilter;
        faceTexture.magFilter = THREE.LinearFilter;

        const faceGroup = new THREE.Group();
        faceGroup.position.set(0, 1, 0);
        scene.add(faceGroup);

        window.doSquashBounce = () => {
            new TWEEN.Tween(faceGroup.scale)
                .to({ x: 1.05, y: 0.95, z: 1.05 }, 200)
                .easing(TWEEN.Easing.Quadratic.In)
                .start();

            setTimeout(() => {
                new TWEEN.Tween(faceGroup.position).to({ y: 1.05 }, 100).start();
                new TWEEN.Tween(faceGroup.rotation).to({ x: -0.1 }, 200).start();
                new TWEEN.Tween(faceGroup.scale).to({ x: 0.95, y: 1.05, z: 0.95 }, 100).start();

                setTimeout(() => {
                    new TWEEN.Tween(faceGroup.position).to({ y: 1 }, 100).start();
                    new TWEEN.Tween(faceGroup.rotation).to({ x: 0 }, 300).start();
                    new TWEEN.Tween(faceGroup.scale).to({ x: 1, y: 1, z: 1 }, 200).start();
                }, 100);
            }, 200);
        };

        const paveMat = new THREE.MeshLambertMaterial({
            color: 0x8e897c,
            map: ptex,
        });
        const pave = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), paveMat);
        pave.rotation.set(-Math.PI / 2, 0, 0);
        pave.position.set(0, -0.02, 0);
        pave.receiveShadow = true;
        scene.add(pave);

        const shdwMat = new THREE.MeshLambertMaterial({
            color: 0x000000,
            map: shdwtex,
            alphaTest: 0.1,
            transparent: true
        });
        const shdw = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shdwMat);
        shdw.position.set(0, 0, 0.01);
        shdw.receiveShadow = true;
        pave.add(shdw);

        let wiggleSystem = null;
        let mouthFrame = 0, eyeFrame = 0, browsOffset = 0, time = 0;
        let faceBone = null;
        let isSpeaking = false;
        let lipSyncTimeouts = [];

        const subtitlesEl = document.getElementById('subtitles');
        const speakBtn = document.getElementById('speakBtn');

        function renderFace() {
            drawFace(mouthFrame, eyeFrame, browsOffset);
            faceTexture.needsUpdate = true;
        }

        function updateSubtitles(word) {
            subtitlesEl.innerHTML = word ? `<span class="highlight">${word}</span>` : '&nbsp;';
        }

        function lipSyncWord(word, startDelay = 0) {
            let charDelay = 0;
            const CHAR_SPEED = 50;

            word.split('').forEach(char => {
                const timeout = setTimeout(() => {
                    mouthFrame = phonemeMap[char.toLowerCase()] || 0;
                    renderFace();
                }, startDelay + charDelay);
                lipSyncTimeouts.push(timeout);
                charDelay += CHAR_SPEED;
            });

            const resetTimeout = setTimeout(() => {
                mouthFrame = 0;
                renderFace();
            }, startDelay + charDelay + 100);
            lipSyncTimeouts.push(resetTimeout);
        }

        function clearTimeouts() {
            lipSyncTimeouts.forEach(clearTimeout);
            lipSyncTimeouts = [];
        }

        function getUKVoice() {
            const voices = speechSynthesis.getVoices();
            const preferredVoices = [
                'Google UK English Male',
                'Daniel',
                'Microsoft Ryan Online (Natural) - English (United Kingdom)',
            ];
            
            for (const preferredName of preferredVoices) {
                const voice = voices.find(v => v.name === preferredName);
                if (voice) return voice;
            }
            
            const ukVoice = voices.find(v => 
                v.lang === 'en-GB' || 
                v.lang === 'en_GB' || 
                v.lang.toLowerCase().includes('en-gb') || 
                v.lang.toLowerCase().includes('en_gb')
            );
            if (ukVoice) return ukVoice;
            
            return voices.find(v => v.lang.toLowerCase().includes('en')) || voices[0];
        }

        function handleSpeak() {
            if (isSpeaking) return;
            
            window.doSquashBounce();
            speechSynthesis.cancel();
            
            const rant = generateRant();
            const words = rant.split(/\s+/);
            
            updateSubtitles('');
            mouthFrame = 0;
            renderFace();
            clearTimeouts();

            const utterance = new SpeechSynthesisUtterance(rant);
            const voice = getUKVoice();
            if (voice) utterance.voice = voice;
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            
            isSpeaking = true;
            speakBtn.disabled = true;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const wordCount = rant.substring(0, event.charIndex).split(/\s+/).length - 1;
                    if (wordCount >= 0 && wordCount < words.length) {
                        updateSubtitles(words[wordCount]);
                        lipSyncWord(words[wordCount]);
                    }
                }
            };

            utterance.onend = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            utterance.onerror = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            speechSynthesis.speak(utterance);
        }

        speakBtn.removeEventListener('click', handleSpeak);
        speakBtn.addEventListener('click', handleSpeak);

        function loadModel() {
            const loader = new FBXLoader();
            loader.load('assets/ukpoo-bones.fbx', (fbx) => {
                const lightsToRemove = [];
                fbx.traverse((child) => {
                    if (child.isLight) lightsToRemove.push(child);
                });
                lightsToRemove.forEach(light => fbx.remove(light));
                if (fbx.environment) fbx.environment = null;

                fbx.rotation.x = Math.PI / 2;
                fbx.scale.set(0.01, 0.01, 0.01);

                const box = new THREE.Box3().setFromObject(fbx);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                fbx.position.sub(center);
                fbx.position.y = -size.y / 2;

                fbx.traverse(child => {
                    if (child.isMesh) {
                        const material = new THREE.MeshLambertMaterial({
                            map: bgTex,
                            side: THREE.FrontSide,
                        });
                        material.map.magFilter = THREE.NearestFilter;
                        material.map.minFilter = THREE.NearestFilter;
                        child.material = material;
                        child.castShadow = true;
                        child.receiveShadow = true;
                        child.renderOrder = 0;
                    }
                });

                faceGroup.position.z = 1;
                faceGroup.add(fbx);

                let headBone = null;
                fbx.traverse((child) => {
                    if (child.isBone && (child.name.toLowerCase().includes('head') || child.name.toLowerCase().includes('neck'))) {
                        headBone = child;
                    }
                });

                if (!headBone) {
                    fbx.traverse((child) => {
                        if (child.isBone && !headBone) {
                            headBone = child;
                        }
                    });
                }

                // Curved face with displacement map
                const planeMat = new THREE.MeshStandardMaterial({
                    map: faceTexture,
                    transparent: true,
                    alphaTest: 0.01,
                    displacementMap: poobumpTex,
                    displacementScale: 3,
                    displacementBias: 0.01,
                    side: THREE.FrontSide,
                    depthTest: false,
                    depthWrite: false,
                });
                planeMat.map.magFilter = THREE.NearestFilter;
                planeMat.map.minFilter = THREE.NearestFilter;
                
                // Use more segments for smoother curve
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3, 32, 1), planeMat);
                plane.position.set(0, 0.9, 0);
                plane.rotation.set(-0.35, 0, 0);
                plane.renderOrder = 999;
                plane.frustumCulled = false;

                if (headBone) {
                    headBone.add(plane);
                    faceBone = headBone;
                } else {
                    fbx.add(plane);
                }

                // Collect bones and calculate their vertical positions
                const bones = [];
                const bonePositions = [];
                
                fbx.traverse((child) => {
                    if (child.isBone) {
                        const worldPos = new THREE.Vector3();
                        child.getWorldPosition(worldPos);
                        bonePositions.push({
                            bone: child,
                            worldY: worldPos.y
                        });
                    }
                });
                
                let minY = Infinity;
                let maxY = -Infinity;
                bonePositions.forEach(bp => {
                    if (bp.worldY < minY) minY = bp.worldY;
                    if (bp.worldY > maxY) maxY = bp.worldY;
                });
                const yRange = maxY - minY || 1;
                
                bonePositions.forEach(bp => {
                    const normalizedHeight = (bp.worldY - minY) / yRange;
                    const heightFactor = Math.pow(normalizedHeight, 0.8);
                    
                    bones.push({
                        bone: bp.bone,
                        phase: Math.random() * Math.PI * 2,
                        weight: 0.2 + Math.random() * 0.5,
                        heightFactor: heightFactor
                    });
                });

                wiggleSystem = {
                    model: fbx,
                    bones: bones,
                    wiggleSpeed: 1.5,
                    wiggleAmplitude: 0.15,
                    updateWiggle(time) {
                        for (let i = 0; i < this.bones.length; i++) {
                            const data = this.bones[i];
                            const bone = data.bone;
                            const t = i / this.bones.length;
                            const phase = data.phase + time * this.wiggleSpeed + t * 2.5;
                            const amp = this.wiggleAmplitude * data.weight * data.heightFactor * (0.5 + t * 0.5);
                            
                            bone.rotation.x = Math.sin(phase) * amp;
                            bone.rotation.z = Math.cos(phase * 0.7 + 0.5) * amp * 0.7;
                            bone.rotation.y = Math.sin(phase * 0.5 + 1.2) * amp * 0.3;
                        }
                    }
                };
            });
        }

        loadModel();

        let clock = new THREE.Clock();
        let elapsedTime = 0;

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            elapsedTime += delta;
            time += 0.02;

            // Only animate idle face when not speaking
            if (!isSpeaking) {
                browsOffset = Math.sin(time * 1.2) * 3;
                renderFace();
            }

            eyeFrame = Math.sin(time * 3) > 0.9 ? 1 : 0;

            if (wiggleSystem) {
                wiggleSystem.updateWiggle(elapsedTime);
            }

            TWEEN.update();
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Ensure voices are loaded
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = () => {
            speechSynthesis.getVoices();
        };
    </script>
</body>

            if (browsTex.image) {
                const bx = FACE_OFFSETS.brows.x;
                const by = FACE_OFFSETS.brows.y + BODY_Y_OFFSET + browsY;
                ctx.drawImage(browsTex.image, bx, by, FACE_OFFSETS.brows.w, FACE_OFFSETS.brows.h);
            }
            if (eyeTex.image) {
                const sxL = eyeIdx * EYE_SPRITE_WIDTH;
                ctx.drawImage(eyeTex.image, sxL, 0, EYE_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.eyeL.x, FACE_OFFSETS.eyeL.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.eyeL.w, FACE_OFFSETS.eyeL.h);
                ctx.drawImage(eyeTex.image, sxL, 0, EYE_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.eyeR.x, FACE_OFFSETS.eyeR.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.eyeR.w, FACE_OFFSETS.eyeR.h);
            }
            if (mouthTex.image) {
                const sxM = mouthIdx * MOUTH_SPRITE_WIDTH;
                ctx.drawImage(mouthTex.image, sxM, 0, MOUTH_SPRITE_WIDTH, 128,
                    FACE_OFFSETS.mouth.x, FACE_OFFSETS.mouth.y + BODY_Y_OFFSET,
                    FACE_OFFSETS.mouth.w, FACE_OFFSETS.mouth.h);
            }
        }
        drawFace(0, 0, 0);
        const faceTexture = new THREE.CanvasTexture(faceCanvas);
        faceTexture.minFilter = THREE.LinearFilter;
        faceTexture.magFilter = THREE.LinearFilter;

        const faceGroup = new THREE.Group();
        faceGroup.position.set(0, 1, 0);
        scene.add(faceGroup);

        window.doSquashBounce = () => {
            new TWEEN.Tween(faceGroup.scale)
                .to({ x: 1.05, y: 0.95, z: 1.05 }, 200)
                .easing(TWEEN.Easing.Quadratic.In)
                .start();

            setTimeout(() => {
                new TWEEN.Tween(faceGroup.position).to({ y: 1.05 }, 100).start();
                new TWEEN.Tween(faceGroup.rotation).to({ x: -0.1 }, 200).start();
                new TWEEN.Tween(faceGroup.scale).to({ x: 0.95, y: 1.05, z: 0.95 }, 100).start();

                setTimeout(() => {
                    new TWEEN.Tween(faceGroup.position).to({ y: 1 }, 100).start();
                    new TWEEN.Tween(faceGroup.rotation).to({ x: 0 }, 300).start();
                    new TWEEN.Tween(faceGroup.scale).to({ x: 1, y: 1, z: 1 }, 200).start();
                }, 100);
            }, 200);
        };

        const paveMat = new THREE.MeshLambertMaterial({
            color: 0x8e897c,
            map: ptex,
        });
        const pave = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), paveMat);
        pave.rotation.set(-Math.PI / 2, 0, 0);
        pave.position.set(0, -0.02, 0);
        pave.receiveShadow = true;
        scene.add(pave);

        const shdwMat = new THREE.MeshLambertMaterial({
            color: 0x000000,
            map: shdwtex,
            alphaTest: 0.1,
            transparent: true
        });
        const shdw = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shdwMat);
        shdw.position.set(0, 0, 0.01);
        shdw.receiveShadow = true;
        pave.add(shdw);

        let wiggleSystem = null;
        let mouthFrame = 0, eyeFrame = 0, browsOffset = 0, time = 0;
        let faceBone = null;
        let isSpeaking = false;
        let lipSyncTimeouts = [];

        const subtitlesEl = document.getElementById('subtitles');
        const speakBtn = document.getElementById('speakBtn');

        function renderFace() {
            drawFace(mouthFrame, eyeFrame, browsOffset);
            faceTexture.needsUpdate = true;
        }

        function updateSubtitles(word) {
            subtitlesEl.innerHTML = word ? `<span class="highlight">${word}</span>` : '&nbsp;';
        }

        function lipSyncWord(word, startDelay = 0) {
            let charDelay = 0;
            const CHAR_SPEED = 50;

            word.split('').forEach(char => {
                const timeout = setTimeout(() => {
                    mouthFrame = phonemeMap[char.toLowerCase()] || 0;
                    renderFace();
                }, startDelay + charDelay);
                lipSyncTimeouts.push(timeout);
                charDelay += CHAR_SPEED;
            });

            const resetTimeout = setTimeout(() => {
                mouthFrame = 0;
                renderFace();
            }, startDelay + charDelay + 100);
            lipSyncTimeouts.push(resetTimeout);
        }

        function clearTimeouts() {
            lipSyncTimeouts.forEach(clearTimeout);
            lipSyncTimeouts = [];
        }

        function getUKVoice() {
            const voices = speechSynthesis.getVoices();
            const preferredVoices = [
                'Google UK English Male',
                'Daniel',
                'Microsoft Ryan Online (Natural) - English (United Kingdom)',
            ];
            
            for (const preferredName of preferredVoices) {
                const voice = voices.find(v => v.name === preferredName);
                if (voice) return voice;
            }
            
            const ukVoice = voices.find(v => 
                v.lang === 'en-GB' || 
                v.lang === 'en_GB' || 
                v.lang.toLowerCase().includes('en-gb') || 
                v.lang.toLowerCase().includes('en_gb')
            );
            if (ukVoice) return ukVoice;
            
            return voices.find(v => v.lang.toLowerCase().includes('en')) || voices[0];
        }

        function handleSpeak() {
            if (isSpeaking) return;
            
            window.doSquashBounce();
            speechSynthesis.cancel();
            
            const rant = generateRant();
            const words = rant.split(/\s+/);
            
            updateSubtitles('');
            mouthFrame = 0;
            renderFace();
            clearTimeouts();

            const utterance = new SpeechSynthesisUtterance(rant);
            const voice = getUKVoice();
            if (voice) utterance.voice = voice;
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            
            isSpeaking = true;
            speakBtn.disabled = true;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const wordCount = rant.substring(0, event.charIndex).split(/\s+/).length - 1;
                    if (wordCount >= 0 && wordCount < words.length) {
                        updateSubtitles(words[wordCount]);
                        lipSyncWord(words[wordCount]);
                    }
                }
            };

            utterance.onend = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            utterance.onerror = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            speechSynthesis.speak(utterance);
        }

        speakBtn.removeEventListener('click', handleSpeak);
        speakBtn.addEventListener('click', handleSpeak);

        function loadModel() {
            const loader = new FBXLoader();
            loader.load('assets/ukpoo-bones.fbx', (fbx) => {
                const lightsToRemove = [];
                fbx.traverse((child) => {
                    if (child.isLight) lightsToRemove.push(child);
                });
                lightsToRemove.forEach(light => fbx.remove(light));
                if (fbx.environment) fbx.environment = null;

                fbx.rotation.x = Math.PI / 2;
                fbx.scale.set(0.01, 0.01, 0.01);

                const box = new THREE.Box3().setFromObject(fbx);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                fbx.position.sub(center);
                fbx.position.y = -size.y / 2;

                fbx.traverse(child => {
                    if (child.isMesh) {
                        const material = new THREE.MeshLambertMaterial({
                            map: bgTex,
                            side: THREE.FrontSide,
                        });
                        material.map.magFilter = THREE.NearestFilter;
                        material.map.minFilter = THREE.NearestFilter;
                        child.material = material;
                        child.castShadow = true;
                        child.receiveShadow = true;
                        child.renderOrder = 0;
                    }
                });

                faceGroup.position.z = 1;
                faceGroup.add(fbx);

                let headBone = null;
                fbx.traverse((child) => {
                    if (child.isBone && (child.name.toLowerCase().includes('head') || child.name.toLowerCase().includes('neck'))) {
                        headBone = child;
                    }
                });

                if (!headBone) {
                    fbx.traverse((child) => {
                        if (child.isBone && !headBone) {
                            headBone = child;
                        }
                    });
                }

                // Curved face with displacement map
                const planeMat = new THREE.MeshStandardMaterial({
                    map: faceTexture,
                    transparent: true,
                    alphaTest: 0.01,
                    displacementMap: poobumpTex,
                    displacementScale: 3,
                    displacementBias: 0.05,
                    side: THREE.FrontSide,
                    depthTest: false,
                    depthWrite: false,
                });
                planeMat.map.magFilter = THREE.NearestFilter;
                planeMat.map.minFilter = THREE.NearestFilter;
                
                // Use more segments for smoother curve
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3, 32, 1), planeMat);
                plane.position.set(0, 0.9, 0);
                plane.rotation.set(-0.35, 0, 0);
                plane.renderOrder = 999;
                plane.frustumCulled = false;

                if (headBone) {
                    headBone.add(plane);
                    faceBone = headBone;
                } else {
                    fbx.add(plane);
                }

                // Collect bones and calculate their vertical positions
                const bones = [];
                const bonePositions = [];
                
                fbx.traverse((child) => {
                    if (child.isBone) {
                        const worldPos = new THREE.Vector3();
                        child.getWorldPosition(worldPos);
                        bonePositions.push({
                            bone: child,
                            worldY: worldPos.y
                        });
                    }
                });
                
                let minY = Infinity;
                let maxY = -Infinity;
                bonePositions.forEach(bp => {
                    if (bp.worldY < minY) minY = bp.worldY;
                    if (bp.worldY > maxY) maxY = bp.worldY;
                });
                const yRange = maxY - minY || 1;
                
                bonePositions.forEach(bp => {
                    const normalizedHeight = (bp.worldY - minY) / yRange;
                    const heightFactor = Math.pow(normalizedHeight, 0.8);
                    
                    bones.push({
                        bone: bp.bone,
                        phase: Math.random() * Math.PI * 2,
                        weight: 0.2 + Math.random() * 0.5,
                        heightFactor: heightFactor
                    });
                });

                wiggleSystem = {
                    model: fbx,
                    bones: bones,
                    wiggleSpeed: 1.5,
                    wiggleAmplitude: 0.15,
                    updateWiggle(time) {
                        for (let i = 0; i < this.bones.length; i++) {
                            const data = this.bones[i];
                            const bone = data.bone;
                            const t = i / this.bones.length;
                            const phase = data.phase + time * this.wiggleSpeed + t * 2.5;
                            const amp = this.wiggleAmplitude * data.weight * data.heightFactor * (0.5 + t * 0.5);
                            
                            bone.rotation.x = Math.sin(phase) * amp;
                            bone.rotation.z = Math.cos(phase * 0.7 + 0.5) * amp * 0.7;
                            bone.rotation.y = Math.sin(phase * 0.5 + 1.2) * amp * 0.3;
                        }
                    }
                };
            });
        }

        loadModel();

        let clock = new THREE.Clock();
        let elapsedTime = 0;

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            elapsedTime += delta;
            time += 0.02;

            // Only animate idle face when not speaking
            if (!isSpeaking) {
                browsOffset = Math.sin(time * 1.2) * 3;
                renderFace();
            }

            eyeFrame = Math.sin(time * 3) > 0.9 ? 1 : 0;

            if (wiggleSystem) {
                wiggleSystem.updateWiggle(elapsedTime);
            }

            TWEEN.update();
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Ensure voices are loaded
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = () => {
            speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
