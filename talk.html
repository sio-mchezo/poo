<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name=viewport content='width=700'>
    <meta charset="utf-8">

    <title>UK Poo</title>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #036C47;
        }
        canvas { display: block; }
        #hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        #hud button {
            padding: 10px;
        }
        #subtitles {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: monospace;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
            min-width: 200px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #subtitles .highlight {
            padding: 4px 12px;
            font-weight: bold;
            animation: pop 0.2s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        #speakBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="hud">
        <button onclick="window.doSquashBounce()">bounce</button>
        <button id="speakBtn">speak</button>
    </div>
    <div id="subtitles">&nbsp;</div>

    <script src="js/rant.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        var rant = require("rant");
        const rants = [
            "<firstname male> <verb like s> to <verb> <noun> with <pron poss male> pet <noun-animal>",
            "The <noun animal> <verb.ed> my <noun furniture> while I was <verb ing> <adv>"
        ];

        function generateRant() {

            return rant(rants[Math.floor(Math.random() * rants.length)]);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.5, 0);
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.maxDistance = 20;
        controls.minDistance = 5;
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 3);
        scene.add(dirLight);

        const textureLoader = new THREE.TextureLoader();
        const textures = {
            eye: textureLoader.load('images/eye.png'),
            mouth: textureLoader.load('images/mouths4.png'),
            brows: textureLoader.load('images/brows.png'),
            body: textureLoader.load('images/poo.png'),
            bump: textureLoader.load('images/poobmp.png'),
            pave: textureLoader.load('images/flag2.jpg'),
            shadow: textureLoader.load('images/shdw.png')
        };
        textures.pave.magFilter = THREE.NearestFilter;
        textures.pave.minFilter = THREE.NearestFilter;

        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = 512;
        faceCanvas.height = 512;
        const ctx = faceCanvas.getContext('2d');

        const FACE_OFFSETS = {
            brows: { x: 128, y: 178, w: 256, h: 256 },
            eyeL: { x: 138, y: 306, w: 128, h: 128 },
            eyeR: { x: 246, y: 306, w: 128, h: 128 },
            mouth: { x: 224, y: 338, w: 64, h: 64 }
        };

        const phonemeMap = {
            " ": 0, ".": 0, ",": 0, "?": 0, "!": 0,
            a: 1, A: 1, g: 1, G: 1, k: 1, K: 1, t: 1, T: 1,
            i: 2, I: 2, y: 2, e: 2, E: 2, s: 2, S: 2,
            z: 2, Z: 2, n: 2, N: 2, d: 2, D: 2,
            l: 2, L: 2, h: 2, H: 2, c: 2, C: 2,
            o: 3, O: 3, u: 3, U: 3, w: 3, q: 3,
            m: 3, M: 3, p: 3, f: 3, F: 3, v: 3, V: 3,
            r: 3, R: 3, b: 1, B: 1
        };

        function drawFace(mouthIdx = 0, eyeIdx = 0, browsY = 0) {
            ctx.clearRect(0, 0, 512, 512);
            
            if (textures.brows.image) {
                ctx.drawImage(textures.brows.image, 
                    FACE_OFFSETS.brows.x, FACE_OFFSETS.brows.y + browsY, 
                    FACE_OFFSETS.brows.w, FACE_OFFSETS.brows.h);
            }
            
            if (textures.eye.image) {
                const sx = eyeIdx * 128;
                ctx.drawImage(textures.eye.image, sx, 0, 128, 128,
                    FACE_OFFSETS.eyeL.x, FACE_OFFSETS.eyeL.y, FACE_OFFSETS.eyeL.w, FACE_OFFSETS.eyeL.h);
                ctx.drawImage(textures.eye.image, sx, 0, 128, 128,
                    FACE_OFFSETS.eyeR.x, FACE_OFFSETS.eyeR.y, FACE_OFFSETS.eyeR.w, FACE_OFFSETS.eyeR.h);
            }
            
            if (textures.mouth.image) {
                ctx.drawImage(textures.mouth.image, mouthIdx * 128, 0, 128, 128,
                    FACE_OFFSETS.mouth.x, FACE_OFFSETS.mouth.y, FACE_OFFSETS.mouth.w, FACE_OFFSETS.mouth.h);
            }
        }

        drawFace();
        const faceTexture = new THREE.CanvasTexture(faceCanvas);

        const faceGroup = new THREE.Group();
        faceGroup.position.set(0, 1, 0);
        scene.add(faceGroup);

        window.doSquashBounce = () => {
            new TWEEN.Tween(faceGroup.scale)
                .to({ x: 1.05, y: 0.95, z: 1.05 }, 200)
                .easing(TWEEN.Easing.Quadratic.In)
                .start();

            setTimeout(() => {
                new TWEEN.Tween(faceGroup.position).to({ y: 1.05 }, 100).start();
                new TWEEN.Tween(faceGroup.rotation).to({ x: -0.1 }, 200).start();
                new TWEEN.Tween(faceGroup.scale).to({ x: 0.95, y: 1.05, z: 0.95 }, 100).start();

                setTimeout(() => {
                    new TWEEN.Tween(faceGroup.position).to({ y: 1 }, 100).start();
                    new TWEEN.Tween(faceGroup.rotation).to({ x: 0 }, 300).start();
                    new TWEEN.Tween(faceGroup.scale).to({ x: 1, y: 1, z: 1 }, 200).start();
                }, 100);
            }, 200);
        };

        const loader = new GLTFLoader();
        loader.load('assets/model.glb', (gltf) => {
            const model = gltf.scene;
            
            model.traverse(child => {
                if (child.isMesh) {
                    child.material = new THREE.MeshLambertMaterial({
                        map: textures.body,
                        side: THREE.FrontSide
                    });
                    child.material.map.magFilter = THREE.NearestFilter;
                    child.material.map.minFilter = THREE.NearestFilter;
                }
            });
            
            faceGroup.add(model);
        

          const outlineGroup = gltf.scene.clone();
            while (outlineGroup.children.length) outlineGroup.remove(outlineGroup.children[0]);
            model.traverse(child => {
                if (child.isMesh) {
                    const geo = child.geometry;
                    const mat = new THREE.MeshBasicMaterial({
                        color: 0x000000,
                        side: THREE.BackSide,
                        transparent: false,
                    });
                    const outlineChild = new THREE.Mesh(geo, mat);
                    outlineChild.position.copy(child.position);
                    outlineChild.rotation.copy(child.rotation);
                    outlineChild.scale.copy(child.scale);
                    outlineChild.scale.multiplyScalar(1.05);
                    outlineGroup.add(outlineChild);
                }
            });
            model.add(outlineGroup);
            outlineGroup.position.set(0, 0, 0);
            outlineGroup.rotation.set(0, 0, 0);
            outlineGroup.scale.set(1, 1, 1);

        }, undefined, (error) => {
            console.warn('Model not loaded, using fallback shape');
        });



        const pave = new THREE.Mesh(
            new THREE.CircleGeometry(1.5, 40),
            new THREE.MeshLambertMaterial({ color: 0x8e897c, map: textures.pave })
        );
        pave.rotation.x = -Math.PI / 2;
        pave.position.y = -0.02;
        scene.add(pave);

        const shadow = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.MeshLambertMaterial({ 
                color: 0x000000, 
                map: textures.shadow, 
                alphaTest: 0.1, 
                transparent: true 
            })
        );
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.y = 0.01;
        scene.add(shadow);

        const facePlane = new THREE.Mesh(
            new THREE.PlaneGeometry(3, 3, 32, 1),
            new THREE.MeshStandardMaterial({
                map: faceTexture,
                transparent: true,
                alphaTest: 0.01,
                displacementMap: textures.bump,
                displacementScale: 3,
                displacementBias: 0.04
            })
        );
        facePlane.rotation.x = -0.35;
        faceGroup.add(facePlane);

        let mouthFrame = 0, eyeFrame = 0, browsOffset = 0, time = 0;
        let isSpeaking = false;
        let lipSyncTimeouts = [];

        const subtitlesEl = document.getElementById('subtitles');
        const speakBtn = document.getElementById('speakBtn');

        function renderFace() {
            drawFace(mouthFrame, eyeFrame, browsOffset);
            faceTexture.needsUpdate = true;
        }

        function updateSubtitles(word) {
            subtitlesEl.innerHTML = word ? `<span class="highlight">${word}</span>` : '&nbsp;';
        }

        function lipSyncWord(word, startDelay = 0) {
            let charDelay = 0;
            const CHAR_SPEED = 50;

            word.split('').forEach(char => {
                const timeout = setTimeout(() => {
                    mouthFrame = phonemeMap[char.toLowerCase()] || 0;
                    renderFace();
                }, startDelay + charDelay);
                lipSyncTimeouts.push(timeout);
                charDelay += CHAR_SPEED;
            });

            const resetTimeout = setTimeout(() => {
                mouthFrame = 0;
                renderFace();
            }, startDelay + charDelay + 100);
            lipSyncTimeouts.push(resetTimeout);
        }

        function clearTimeouts() {
            lipSyncTimeouts.forEach(clearTimeout);
            lipSyncTimeouts = [];
        }

                // Add this function before the speak button handler
        function getUKVoice() {
            const voices = speechSynthesis.getVoices();
            
            const preferredVoices = [
                'Google UK English Female',
                'Google UK English Male',
                'Daniel',
                'Kate',
                'Serena',
                'Microsoft Libby Online (Natural) - English (United Kingdom)',
                'Microsoft Ryan Online (Natural) - English (United Kingdom)',
                'Microsoft Sonia Online (Natural) - English (United Kingdom)',
                'Microsoft Hayley Online (Natural) - English (United Kingdom)'
            ];
            
            for (const preferredName of preferredVoices) {
                const voice = voices.find(v => v.name === preferredName);
                if (voice) return voice;
            }
            
            const ukVoice = voices.find(v => 
                v.lang === 'en-GB' || 
                v.lang === 'en_GB' || 
                v.lang.toLowerCase().includes('en-gb') || 
                v.lang.toLowerCase().includes('en_gb')
            );
            if (ukVoice) return ukVoice;
            
            return voices.find(v => v.lang.toLowerCase().includes('en')) || voices[0];
        }

        speakBtn.addEventListener('click', () => {
            if (isSpeaking) return;
            
            doSquashBounce();
            speechSynthesis.cancel();
            
            const rant = generateRant();
            const words = rant.split(/\s+/);
            
            updateSubtitles('');
            mouthFrame = 0;
            renderFace();
            clearTimeouts();

            const utterance = new SpeechSynthesisUtterance(rant);
            utterance.voice = getUKVoice();
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            
            isSpeaking = true;
            speakBtn.disabled = true;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const wordCount = rant.substring(0, event.charIndex).split(/\s+/).length - 1;
                    if (wordCount >= 0 && wordCount < words.length) {
                        updateSubtitles(words[wordCount]);
                        lipSyncWord(words[wordCount]);
                    }
                }
            };

            utterance.onend = utterance.onerror = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            speechSynthesis.speak(utterance);
        });

        speakBtn.addEventListener('click', () => {
            if (isSpeaking) return;
            
            doSquashBounce();
            speechSynthesis.cancel();
            
            const rant = generateRant();
            const words = rant.split(/\s+/);
            
            updateSubtitles('');
            mouthFrame = 0;
            renderFace();
            clearTimeouts();

            const utterance = new SpeechSynthesisUtterance(rant);
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            
            const ukVoice = speechSynthesis.getVoices().find(v => v.lang.includes('en-GB'));
            if (ukVoice) utterance.voice = ukVoice;
            
            isSpeaking = true;
            speakBtn.disabled = true;

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const wordCount = rant.substring(0, event.charIndex).split(/\s+/).length - 1;
                    if (wordCount >= 0 && wordCount < words.length) {
                        updateSubtitles(words[wordCount]);
                        lipSyncWord(words[wordCount]);
                    }
                }
            };

            utterance.onend = utterance.onerror = () => {
                updateSubtitles('');
                mouthFrame = 0;
                renderFace();
                isSpeaking = false;
                speakBtn.disabled = false;
                clearTimeouts();
            };

            speechSynthesis.speak(utterance);
        });

        function animate() {
            time += 0.02;
            
            if (!isSpeaking) {
                browsOffset = Math.sin(time * 1.2) * 3;
                renderFace();
            }
            eyeFrame = Math.sin(time * 2) > 0.8 ? 1 : 0;
            TWEEN.update();
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Ensure voices are loaded
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = () => {
            speechSynthesis.getVoices();
        };

        animate();
    </script>
</body>
</html>
